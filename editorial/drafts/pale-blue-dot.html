<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>النقطة الزرقاء الباهتة: الصورة التي أعادت تعريف الأرض | مسودة Deep Documentary</title><link rel="icon" href="../../assets/logo.svg"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{background:#090a0c;color:#f4f0e8;margin:0;font:18px/2 'Cairo','Inter',sans-serif}main{max-width:920px;margin:auto;padding:40px 22px 90px}header{padding:18px 24px;border-bottom:1px solid #514029;display:flex;justify-content:space-between}a,h2{color:#dfb95d}button{background:transparent;color:#dfb95d;border:1px solid #dfb95d;border-radius:24px;padding:8px 18px;cursor:pointer}h1{font-size:clamp(30px,5vw,52px);line-height:1.5}h2{font-size:25px}p{color:#d6d2ca;margin:0 0 22px}section{margin:42px 0;padding:8px 20px;border-inline-start:2px solid #66502a}.warning{border:1px solid #b98b36;background:#211a0c;padding:14px;border-radius:10px;color:#f4ce7a}.sources{border:1px solid #46381f;border-radius:14px;padding:20px}.sources li{margin:10px 0;overflow-wrap:anywhere}</style></head><body><header><a href="../../index.html">◈ DEEP DOCUMENTARY</a><button id="toggle">English 🌐</button></header><main><div class="warning" id="draft">مسودة تحريرية للمراجعة — ليست جاهزة للنشر الرسمي</div><h1 id="title"></h1><div id="story"></div><aside class="sources"><h2 id="sourceTitle">المصادر الأصلية</h2><ol><li><a href="https://science.nasa.gov/mission/voyager/voyager-1s-pale-blue-dot/" target="_blank" rel="noopener noreferrer">NASA — Pale Blue Dot Image</a></li><li><a href="https://science.nasa.gov/resource/voyager-pale-blue-dot-download/" target="_blank" rel="noopener noreferrer">NASA — Image Downloads and Credits</a></li><li><a href="https://science.nasa.gov/resource/first-ever-solar-system-family-portrait-1990/" target="_blank" rel="noopener noreferrer">NASA — First-Ever Solar System Family Portrait</a></li></ol></aside></main><script>const titles={"ar":"النقطة الزرقاء الباهتة: الصورة التي أعادت تعريف الأرض","en":"Pale Blue Dot: The Image That Reframed Earth"};const data=[{"ar":["صورة تبدو فارغة","في 14 فبراير 1990، وجهت المركبة فوياجر 1 كاميرتها نحو الداخل، باتجاه الشمس والكواكب التي تركتها خلفها. في إحدى الصور لم تظهر الأرض ككرة زرقاء واضحة؛ ظهرت كنقطة صغيرة جدًا وسط شعاع ضوء متناثر. كان من السهل ألا يلاحظها المشاهد أصلًا."],"en":["A photograph that looks empty","On February 14, 1990, Voyager 1 turned its camera back toward the inner solar system. In one frame Earth was not a recognizable globe. It was a tiny speck within scattered sunlight—easy to miss unless you knew where to look."]},{"ar":["كيف وصلت فوياجر إلى هناك؟","أطلقت ناسا فوياجر 1 عام 1977 لاستكشاف الكواكب الخارجية. زارت المشتري وزحل وقدمت صورًا وقياسات غيّرت فهم العلماء لهما ولأقمارهما. وبعد انتهاء المرحلة الأساسية من مهمتها، واصلت المركبة الابتعاد عن الشمس، حاملة أدواتها ورسائلها إلى مسافات لم تبلغها مركبة بشرية قبلها."],"en":["How Voyager got there","NASA launched Voyager 1 in 1977 to explore the outer planets. It studied Jupiter and Saturn, returning images and measurements that transformed planetary science. After its main encounters, it continued outward into regions no spacecraft had previously reached."]},{"ar":["لماذا التقطت الصورة؟","جاءت صورة الأرض ضمن سلسلة من ستين لقطة استُخدمت لتكوين «صورة عائلية» للنظام الشمسي. لم تكن محاولة لقياس تضاريس الأرض أو سحبها؛ فالمسافة جعلت كوكبنا أصغر من أن تظهر تفاصيله. كانت الصورة محاولة غير عادية للنظر إلى موطن البشر من مكان بعيد جدًا."],"en":["Why take the picture?","The Earth image belonged to a sequence of sixty frames intended as a solar-system family portrait. It was not designed to map Earth’s surface; at that distance our planet was too small to show meaningful detail. Its value was the extraordinary viewpoint."]},{"ar":["ستة مليارات كيلومتر","تذكر ناسا أن فوياجر 1 التقطت الصورة من مسافة تقارب ستة مليارات كيلومتر من الشمس. عند تلك المسافة لا يمكن للصورة أن تكشف حدود الدول أو المحيطات. تصبح الأرض مجرد أثر ضوئي صغير، رغم أنها تحتوي كل المدن واللغات والتواريخ التي نعرفها."],"en":["Six billion kilometers","NASA places Voyager 1 roughly six billion kilometers from the Sun when the photograph was taken. At that distance there are no visible borders, oceans, or cities. Earth becomes a faint trace of light despite containing every human life and history we know."]},{"ar":["الصورة ليست لقطة واحدة للنظام الشمسي","عندما يقال إن فوياجر صورت «العائلة الشمسية»، قد يتخيل البعض صورة واسعة واحدة تظهر جميع الكواكب مصطفة. الواقع أنها التقطت سلسلة صور جُمعت لاحقًا في فسيفساء. وقد ظهرت ستة كواكب في ذلك المشروع، لا كل الكواكب بصورة متساوية الوضوح."],"en":["Not one snapshot of the entire solar system","The phrase solar-system family portrait can suggest one wide photograph of planets neatly aligned. In fact, Voyager captured separate frames later assembled into a mosaic. Six planets appeared in the project, not every planet in equal clarity."]},{"ar":["أشعة الشمس داخل الكاميرا","الخطوط المضيئة التي تعبر الصورة ناتجة عن تشتت ضوء الشمس داخل نظام التصوير. ظهرت الأرض في أحد هذه الخطوط، ما منح الصورة شكلها المعروف. لذلك لا ينبغي تفسير الشعاع بوصفه ظاهرة فضائية غامضة تحيط بكوكبنا؛ إنه أثر بصري متعلق بطريقة التقاط الصورة."],"en":["Sunlight inside the camera","The bright streaks crossing the image came from sunlight scattering in the camera optics. Earth happened to lie within one of them. The beam is not an unknown cosmic structure surrounding our planet; it is part of how the image was recorded."]},{"ar":["كارل ساغان ومعنى النقطة","أصبحت الصورة مرتبطة باسم العالم والكاتب كارل ساغان، الذي استخدمها للتأمل في مكانة الإنسان داخل الكون. لكن قوتها لا تتطلب اقتباسًا طويلًا: تكفي المقارنة بين حجم النقطة وما نعرف أنه موجود فوقها لتغيير طريقة النظر إلى خلافاتنا وحدودنا."],"en":["Carl Sagan and the meaning of the dot","The photograph became closely associated with scientist and writer Carl Sagan, who reflected on humanity’s place in the cosmos. Yet the image needs little explanation: comparing that speck with everything it contains is enough to alter our sense of scale."]},{"ar":["إعادة معالجة لا تعني صورة جديدة","في الذكرى الثلاثين للصورة عام 2020، نشرت ناسا نسخة أعيدت معالجتها باستخدام أدوات حديثة مع احترام بيانات التصوير الأصلية. قد تبدو الألوان والتباين مختلفة بين النسختين، لكن ذلك لا يعني أن فوياجر عادت والتقطت الأرض مرة ثانية من الموضع نفسه."],"en":["A remaster is not a new exposure","For the image’s thirtieth anniversary in 2020, NASA released a reprocessed version using modern tools while respecting the original data. Color and contrast may differ from the earlier presentation, but Voyager did not return to take the same photograph again."]},{"ar":["آخر نظرة بالكاميرات","كانت صور «العائلة الشمسية» من آخر الصور التي التقطتها كاميرات فوياجر 1 قبل إيقافها لتوفير الطاقة. واصلت المركبة رحلتها العلمية بأجهزة أخرى، بينما بقيت النقطة الزرقاء الباهتة تذكيرًا بأن أضخم قصصنا قد تشغل في صورة بعيدة أقل من بكسل."],"en":["A final look through the cameras","The family portrait was among the last images returned by Voyager 1’s cameras before they were switched off to conserve power. The spacecraft continued its scientific journey with other instruments. The tiny dot remained a reminder of how much human meaning can fit inside almost no visible space."]}];let lang='ar';function render(){let a=lang==='ar';document.documentElement.lang=lang;document.documentElement.dir=a?'rtl':'ltr';document.getElementById('toggle').textContent=a?'English 🌐':'العربية 🌐';document.getElementById('draft').textContent=a?'مسودة تحريرية للمراجعة — ليست جاهزة للنشر الرسمي':'EDITORIAL DRAFT — NOT APPROVED FOR PUBLICATION';document.getElementById('title').textContent=titles[lang];document.getElementById('sourceTitle').textContent=a?'المصادر الأصلية':'Primary sources';document.getElementById('story').innerHTML=data.map(x=>{let v=x[lang];return '<section><h2>'+v[0]+'</h2><p>'+v[1]+'</p></section>'}).join('')}document.getElementById('toggle').onclick=()=>{lang=lang==='ar'?'en':'ar';render()};render();</script></body></html>

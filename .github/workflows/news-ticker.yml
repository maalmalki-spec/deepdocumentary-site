name: Update bilingual news ticker
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bilingual-news-ticker
  cancel-in-progress: false
jobs:
  ticker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Collect verified-source headlines
        run: python scripts/update_news_ticker.py
      - name: Commit refreshed headlines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/news-ticker.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh bilingual news ticker"
            git pull --rebase
            git push
          fi

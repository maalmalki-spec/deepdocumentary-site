name: Update documentary catalogue
on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'scripts/build_documentary_catalogue.py'
      - '.github/workflows/documentary-catalogue.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build catalogue from published articles
        run: python scripts/build_documentary_catalogue.py
      - name: Commit changed catalogue
        run: |
          if ! git diff --quiet -- assets/documentary-catalogue.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/documentary-catalogue.json
            git commit -m "Auto-update documentary series catalogue"
            git push
          fi

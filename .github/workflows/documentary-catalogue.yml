name: Update documentary catalogue
on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'scripts/build_documentary_catalogue.py'
      - 'scripts/sync_documentary_series.py'
      - 'scripts/build_daily_facts.py'
      - 'index.html'
      - '.github/workflows/documentary-catalogue.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shared components on all published articles
        run: python scripts/sync_documentary_series.py
      - name: Build catalogue from published articles
        run: python scripts/build_documentary_catalogue.py
      - name: Build verified daily facts from article metadata
        run: python scripts/build_daily_facts.py
      - name: Commit changed catalogue
        run: |
          if ! git diff --quiet -- assets/documentary-catalogue.json assets/daily-facts-generated.json index.html articles/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/documentary-catalogue.json assets/daily-facts-generated.json index.html articles/
            git commit -m "Auto-sync documentary series and sourced daily facts"
            git push
          fi

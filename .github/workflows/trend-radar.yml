name: Update editorial trend radar
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: editorial-trend-radar
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Collect recent cross-category headlines
        run: python scripts/update_trend_radar.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/trend-radar.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh editorial trend radar"
            git push
          fi

name: Editorial release gate
on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'scripts/check_editorial_release.py'
      - '.github/workflows/editorial-release-gate.yml'
  pull_request:
    paths:
      - 'articles/**'
      - 'scripts/check_editorial_release.py'
      - '.github/workflows/editorial-release-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-article-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check newly added article pages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Missing comparison commit; fail closed."
            exit 1
          fi
          mapfile -d '' files < <(git diff --name-only --diff-filter=A -z "$BASE" HEAD -- 'articles/*.html')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No new articles in this change."
          else
            python3 scripts/check_editorial_release.py "${files[@]}"
          fi

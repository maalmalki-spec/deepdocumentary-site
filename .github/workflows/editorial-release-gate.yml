name: Editorial release gate
on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'scripts/check_editorial_release.py'
      - '.github/workflows/editorial-release-gate.yml'
  pull_request:
    paths:
      - 'articles/**'
      - 'scripts/check_editorial_release.py'
      - '.github/workflows/editorial-release-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-article-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate article changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mapfile -d '' files < <(find articles -maxdepth 1 -name '*.html' -print0)
          else
            BASE="$BASE_SHA"
            if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              echo "Missing comparison commit; fail closed."
              exit 1
            fi
            mapfile -d '' files < <(git diff --name-only --diff-filter=AM -z "$BASE" HEAD -- 'articles/*.html')
            if git diff --name-only "$BASE" HEAD -- scripts/check_editorial_release.py .github/workflows/editorial-release-gate.yml | grep -q .; then
              mapfile -d '' files < <(find articles -maxdepth 1 -name '*.html' -print0)
            fi
          fi
          if (( ${#files[@]} )); then
            python3 scripts/check_editorial_release.py "${files[@]}"
          else
            echo "No article pages changed."
          fi

name: Archive and audit article images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'index.html'
      - 'scripts/archive_article_images.py'
      - '.github/workflows/archive-article-images.yml'
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests Pillow
      - name: Archive verified NASA images and audit other images
        run: python scripts/archive_article_images.py
      - name: Save archived images and audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles index.html assets/images assets/image-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified article images and update image audit"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            echo "Could not publish after five attempts" >&2
            exit 1
          fi

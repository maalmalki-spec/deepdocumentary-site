name: Visual and asset audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-asset-audit.yml'
permissions:
  contents: read
jobs:
  visual-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check local images and stylesheets
        run: python3 scripts/check_local_assets.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture desktop and mobile and check horizontal overflow
        run: node scripts/visual_audit.cjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-visual-audit
          path: audit-output/
          if-no-files-found: warn

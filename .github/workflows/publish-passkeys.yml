name: Publish passkeys documentary with verified local imagery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/publish_passkeys.py
      - .github/workflows/publish-passkeys.yml
concurrency:
  group: publish-documentary-articles
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests Pillow
      - run: python scripts/publish_passkeys.py
      - name: Validate all archived images and HTML references
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('.')
          slug='passkeys-end-of-passwords-2026'
          sources=json.loads((root/'assets/images'/slug/'SOURCES.json').read_text())
          assert len(sources)>=5
          article=(root/'articles'/f'{slug}.html').read_text()
          assert len(set(x['sha256'] for x in sources))>=5
          for item in sources:
              f=root/'assets/images'/slug/item['file']
              assert f.exists() and f.stat().st_size>14000
              assert '../assets/images/'+slug+'/'+item['file'] in article
          assert 'noindex' not in article
          PY
      - name: Apply shared site metadata and verify analytics
        run: |
          python scripts/ensure_article_seo.py
          python scripts/sync_documentary_series.py
          python scripts/install_analytics.py --check
      - name: Commit published article and archived images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/passkeys-end-of-passwords-2026.html assets/images/passkeys-end-of-passwords-2026 index.html sitemap.xml
          # Keep only the staged files for this article's publication.
          git restore --worktree -- .
          if ! git diff --cached --quiet; then
            git commit -m "Publish passkeys documentary with verified licensed local photos"
            git pull --rebase origin main
            git push origin main
          fi

name: Update sitemap on article publication
on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'scripts/generate_sitemap.py'
      - '.github/workflows/article-sitemap.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: article-sitemap
  cancel-in-progress: false
jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate sitemap
        run: python3 scripts/generate_sitemap.py
      - name: Commit only when changed
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: refresh sitemap for published articles [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

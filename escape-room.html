ar:{back:"← الألعاب",title:"🏛️ سر المعبد المفقود",intro:"أُغلق باب المعبد خلفك! استكشف الغرفة واجمع الأدلة وافتح الخزنة ثم اهرب.",difficulty:"المستوى",levels:["سهل","متوسط","صعب"],restart:"↻ إعادة البداية",soundOn:"🔊 الصوت",soundOff:"🔇 الصوت",panel:"🔎 سجل الاستكشاف",welcome:"اضغط على الأشياء داخل المعبد للبحث عن أدلة. افتح الخزنة لتحصل على المفتاح.",mural:"على الجدار نقش حجري. الرقم الأول هو {n}.",clock:"توقفت الساعة عند الرقم {n}. هذا الرقم الثاني.",book:"تقول المخطوطة: الرقم الثالث هو {n}. تذكّر ترتيب الأدلة: النقش، الساعة، المخطوطة.",chest:"خزنة حجرية مقفلة. اجمع الأرقام الثلاثة بالترتيب لفتحها.",doorLocked:"الباب مغلق بإحكام. تحتاج إلى المفتاح الموجود داخل الخزنة.",doorOpen:"فتحت الباب وخرجت من المعبد!",already:"لقد فتحت الخزنة وحصلت على المفتاح الذهبي.",wrong:"الرمز غير صحيح. راجع الأدلة وترتيبها.",need:"ابحث عن الأدلة الثلاثة أولًا.",success:"فتحت الخزنة! حصلت على المفتاح الذهبي 🗝️",key:"🗝️ المفتاح الذهبي",clues:"الأدلة المكتشفة",code:"أدخل رمز الخزنة المكوّن من ثلاثة أرقام",unlock:"افتح الخزنة",close:"إغلاق",hint:"💡 تلميح",hint1:"ابحث في النقش والساعة والمخطوطة.",hint2:"رتّب الأرقام: النقش ثم الساعة ثم المخطوطة.",hint3:"الرمز هو {code}.",win:"🎉 نجحت في الهروب!",time:"الوقت",playAgain:"العب مرة أخرى",resetConfirm:"هل تريد بدء مغامرة جديدة؟"},

const configs={easy:[3,1,4],medium:[7,2,9],hard:[8,6,3]};
let lang=document.documentElement.lang==="en"?"en":"ar",sound=false,timerId=null;
function fresh(level){return {level,seen:[],key:false,won:false,seconds:0,hints:0,started:Date.now()}}
function load(){try{const s=JSON.parse(localStorage.getItem(storageKey)||"null");if(s&&configs[s.level]&&Array.isArray(s.seen)&&typeof s.seconds==="number"&&typeof s.key==="boolean"&&typeof s.won==="boolean")return s}catch(e){}return fresh("easy")}

function save(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(e){}}
function t(k){return words[lang][k]}
function format(k,values){return t(k).replace(/\{(\w+)\}/g,(_,key)=>values[key]??"")}
function speak(text){$("message").textContent=text}
function beep(){if(!sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=540;gain.gain.value=.035;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.09);osc.onended=()=>ctx.close()}catch(e){}}
function clock(){const m=String(Math.floor(state.seconds/60)).padStart(2,"0"),s=String(state.seconds%60).padStart(2,"0");$("timer").textContent="⏱ "+m+":"+s}
function render(){const w=words[lang];document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("back").textContent=w.back;$("title").textContent=w.title;$("intro").textContent=w.intro;$("difficulty-label").textContent=w.difficulty;$("restart").textContent=w.restart;$("sound").textContent=sound?w.soundOn:w.soundOff;$("sound").setAttribute("aria-pressed",String(sound));$("panel-title").textContent=w.panel;$("code-label").textContent=w.code;$("unlock").textContent=w.unlock;$("close-puzzle").textContent=w.close;$("hint").textContent=w.hint;[...$("difficulty").options].forEach((o,i)=>o.textContent=w.levels[i]);$("difficulty").value=state.level;document.querySelectorAll("[data-ar][data-en]").forEach(e=>e.textContent=e.dataset[lang]);$("inventory").replaceChildren();if(state.key){const b=document.createElement("span");b.className="badge";b.textContent=w.key;$("inventory").append(b)}$("progress").textContent=w.clues+": "+state.seen.length+"/3";$("finish").classList.toggle("hidden",!state.won);if(state.won){$("finish").replaceChildren();const h=document.createElement("h2");h.textContent=w.win;const p=document.createElement("p");p.textContent=w.time+": "+$("timer").textContent.slice(2);const b=document.createElement("button");b.type="button";b.textContent=w.playAgain;b.addEventListener("click",()=>restart(false));$("finish").append(h,p,b)}clock()}
function examine(obj){if(state.won)return;beep();$("puzzle").classList.add("hidden");const map={mural:0,clock:1,book:2};if(Object.hasOwn(map,obj)){if(!state.seen.includes(obj))state.seen.push(obj);speak(format(obj,{n:configs[state.level][map[obj]]}));save();render();return}if(obj==="chest"){if(state.key){speak(t("already"));return}if(state.seen.length<3){speak(t("need"));return}speak(t("chest"));$("puzzle").classList.remove("hidden");$("code").focus();return}if(obj==="door"){if(!state.key){speak(t("doorLocked"));return}state.won=true;save();speak(t("doorOpen"));render()}}
function unlock(){const code=configs[state.level].join("");if($("code").value.trim()===code&&state.seen.length===3){state.key=true;save();$("puzzle").classList.add("hidden");$("code").value="";beep();speak(t("success"));render()}else{speak(state.seen.length<3?t("need"):t("wrong"));$("code").select()}}

new MutationObserver(()=>{const next=document.documentElement.lang==="en"?"en":"ar";if(next!==lang){lang=next;render();speak(state.won?t("doorOpen"):t("welcome"))}}).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]});
render();speak(state.won?t("doorOpen"):t("welcome"));timerId=setInterval(()=>{if(!state.won){state.seconds++;save();clock()}},1000);

<body><header><a class="brand" href="games.html"><img src="assets/logo.svg" alt="">DEEP DOCUMENTARY</a><button id="language" type="button">English 🌐</button></header><main><a href="games.html" id="back">← العودة للألعاب</a><h1 id="title">🕵️ من أنا؟</h1><p class="muted" id="intro">خمسة تلميحات. اكتشف الإجابة بأقل عدد من التلميحات لتحصد نقاطًا أكثر.</p><section class="card" aria-live="polite"><div class="stats"><strong id="round"></strong><strong id="score"></strong></div><h2 id="prompt"></h2><div id="clues"></div><div class="answers" id="answers"></div><p class="feedback" id="feedback" role="status"></p><div class="controls"><button id="hint" type="button"></button><button id="next" type="button" hidden></button></div></section></main><footer>© 2026 DEEP DOCUMENTARY</footer>
<script>
"use strict";
const BANK=[
{a:["نيل أرمسترونغ","Neil Armstrong"],c:[["كنت طيارًا قبل أن أصبح رائد فضاء.","I was a pilot before becoming an astronaut."],["شاركت في برنامج جيميني.","I flew in the Gemini program."],["كانت رحلتي الأشهر عام 1969.","My most famous mission was in 1969."],["كنت قائد أبولو 11.","I commanded Apollo 11."],["كنت أول إنسان يمشي على القمر.","I was the first human to walk on the Moon."]],f:["قاد أرمسترونغ مهمة أبولو 11 ومشى على القمر عام 1969.","Armstrong commanded Apollo 11 and walked on the Moon in 1969."]},
{a:["ماري كوري","Marie Curie"],c:[["درست الفيزياء والكيمياء.","I studied physics and chemistry."],["وُلدت في بولندا وعملت في فرنسا.","I was born in Poland and worked in France."],["درست ظاهرة النشاط الإشعاعي.","I researched radioactivity."],["حصلت على جائزتي نوبل في مجالين علميين.","I received Nobel Prizes in two sciences."],["اكتشفت مع زوجي البولونيوم والراديوم.","My husband and I discovered polonium and radium."]],f:["فازت كوري بنوبل الفيزياء عام 1903 والكيمياء عام 1911.","Curie won the Physics Nobel in 1903 and Chemistry Nobel in 1911."]},
{a:["تلسكوب جيمس ويب","James Webb Space Telescope"],c:[["أعمل بعيدًا عن سطح الأرض.","I operate far from Earth's surface."],["أدرس الأجرام البعيدة.","I study distant celestial objects."],["أرصد الضوء تحت الأحمر أساسًا.","I mainly observe infrared light."],["أُطلقت إلى الفضاء في عام 2021.","I launched into space in 2021."],["اسمي مرتبط بتلسكوب فضائي ذي مرآة مذهبة.","My name belongs to a space telescope with a gold-coated mirror."]],f:["أُطلق تلسكوب جيمس ويب في ديسمبر 2021 لدراسة الكون بالأشعة تحت الحمراء.","The James Webb Space Telescope launched in December 2021 to study the universe in infrared."]},
{a:["مكتبة الإسكندرية القديمة","Ancient Library of Alexandria"],c:[["كنت مركزًا شهيرًا للمعرفة.","I was a famous center of learning."],["ارتبطت بالعالم الهلنستي.","I was associated with the Hellenistic world."],["نشأت في مصر القديمة.","I arose in ancient Egypt."],["ازدهرت في العصر البطلمي.","I flourished during the Ptolemaic era."],["حملت اسم مدينة أسسها الإسكندر الأكبر.","I bore the name of a city founded by Alexander the Great."]],f:["كانت مكتبة الإسكندرية جزءًا من الحياة العلمية في مصر البطلمية، وتاريخ زوالها محل نقاش.","The Library of Alexandria was part of Ptolemaic Egypt's scholarly life; its decline remains debated."]},
{a:["سبوتنيك 1","Sputnik 1"],c:[["كنت جسمًا صنعه الإنسان.","I was human-made."],["ارتبطت ببداية عصر الفضاء.","I marked the dawn of the Space Age."],["أُطلقت في خمسينيات القرن العشرين.","I launched in the 1950s."],["أطلقني الاتحاد السوفيتي.","The Soviet Union launched me."],["كنت أول قمر صناعي يدور حول الأرض.","I was the first artificial satellite to orbit Earth."]],f:["أُطلق سبوتنيك 1 في 4 أكتوبر 1957.","Sputnik 1 launched on October 4, 1957."]},
{a:["تشارلز داروين","Charles Darwin"],c:[["كنت عالم طبيعة بريطانيًا.","I was a British naturalist."],["سافرت على متن سفينة أبحاث.","I traveled on a survey ship."],["درست تنوع الكائنات الحية.","I studied the diversity of living things."],["أبحرت على متن بيغل.","I sailed aboard the Beagle."],["ألّفت كتاب أصل الأنواع.","I wrote On the Origin of Species."]],f:["نشر داروين كتاب أصل الأنواع عام 1859.","Darwin published On the Origin of Species in 1859."]}
];
const L={ar:{back:"← العودة للألعاب",title:"🕵️ من أنا؟",intro:"خمسة تلميحات. اكتشف الإجابة بأقل عدد من التلميحات لتحصد نقاطًا أكثر.",round:"الجولة",score:"النقاط",prompt:"من أنا؟",hint:"أظهر تلميحًا",next:"التالي ←",end:"انتهت اللعبة!",again:"العب مجددًا",correct:"إجابة صحيحة!",wrong:"ليست الإجابة الصحيحة.",answer:"الإجابة:",points:"نقاط"},en:{back:"← Back to games",title:"🕵️ Who Am I?",intro:"Five clues. Guess early to earn more points.",round:"Round",score:"Score",prompt:"Who am I?",hint:"Reveal a clue",next:"Next →",end:"Game complete!",again:"Play again",correct:"Correct!",wrong:"Not quite.",answer:"Answer:",points:"points"}};
let lang=localStorage.getItem("dd-language")==="en"?"en":"ar",order=[],index=0,shown=1,total=0,done=false;
const el=id=>document.getElementById(id),val=a=>a[lang==="ar"?0:1];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){order=shuffle([...BANK.keys()]);index=0;total=0;renderRound()}
function renderRound(){shown=1;done=false;draw()}
function draw(){const w=L[lang],q=BANK[order[index]];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";el("language").textContent=lang==="ar"?"English 🌐":"العربية 🌐";["back","title","intro"].forEach(id=>el(id).textContent=w[id]);el("round").textContent=w.round+" "+(index+1)+"/"+order.length;el("score").textContent=w.score+": "+total;el("prompt").textContent=w.prompt;el("clues").replaceChildren();q.c.slice(0,shown).forEach(c=>{let p=document.createElement("p");p.className="clue";p.textContent=val(c);el("clues").append(p)});el("answers").replaceChildren();const choices=shuffle([order[index],...shuffle(BANK.map((_,i)=>i).filter(i=>i!==order[index])).slice(0,3)]);choices.forEach(i=>{let b=document.createElement("button");b.type="button";b.textContent=val(BANK[i].a);b.disabled=done;b.addEventListener("click",()=>guess(i));el("answers").append(b)});el("hint").textContent=w.hint+" ("+shown+"/5)";el("hint").hidden=done||shown===5;el("next").hidden=!done;el("next").textContent=index===order.length-1?w.again:w.next;if(!done)el("feedback").textContent=""}
function guess(i){if(done)return;done=true;const q=BANK[order[index]],ok=i===order[index],earned=ok?6-shown:0;total+=earned;draw();el("feedback").textContent=(ok?L[lang].correct+" +"+earned+" "+L[lang].points:L[lang].wrong+" "+L[lang].answer+" "+val(q.a))+" — "+val(q.f);el("score").textContent=L[lang].score+": "+total}
el("hint").addEventListener("click",()=>{if(!done&&shown<5){shown++;draw()}});el("next").addEventListener("click",()=>{if(index===order.length-1){start()}else{index++;renderRound()}});el("language").addEventListener("click",()=>{lang=lang==="ar"?"en":"ar";localStorage.setItem("dd-language",lang);draw()});start();
</script></body></html>

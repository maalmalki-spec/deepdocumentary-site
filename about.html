kground:linear-gradient(90deg,transparent,var(--gold),transparent);margin:48px auto;max-width:700px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{background:linear-gradient(145deg,#1a1b1f,#101114);border:1px solid var(--line);border-radius:18px;padding:30px}.card h2,.section h2{color:var(--gold);font-size:25px;margin:0 0 16px}.card p,.section p,.section li{color:#d3cec4;line-height:2.1;margin:0}.section{padding:42px 0;border-bottom:1px solid #302b22}.section ul{padding-inline-start:25px}.section li{margin-bottom:10px}.cta{display:inline-block;margin-top:22px;padding:12px 27px;border-radius:26px;background:var(--gold);color:#111;font-weight:800}footer{border-top:1px solid var(--line);padding:28px;text-align:center;color:#aaa;font-size:13px}footer a{color:var(--gold);margin:0 7px}@media(max-width:650px){header{padding:13px 15px;flex-wrap:wrap}.brand img{width:37px;height:37px}.actions{gap:6px}.btn{padding:8px 10px;font-size:12px}.wrap{padding:42px 19px 65px}.grid{grid-template-columns:1fr}.card{padding:23px}.section{padding:30px 0}} </style><meta name="robots" content="index,follow,max-image-preview:large"><meta property="og:type" content="website"><meta property="og:title" content="من نحن | Deep Documentary"><meta property="og:description" content="تعرف على Deep Documentary، منصة قصص وثائقية عربية وإنجليزية في التاريخ والعلوم والفضاء والغموض."><meta property="og:url" content="https://deepdocumentary.com/about.html"><meta property="og:site_name" content="Deep Documentary"><link rel="stylesheet" href="assets/secondary-header.css"><link rel="stylesheet" href="assets/shared-footer.css"></head><body><header class="dd-unified-header"><a class="dd-unified-brand" href="index.html" aria-label="Deep Documentary home"><img src="assets/logo.svg" alt="Deep Documentary logo" width="62" height="62"><span class="dd-unified-text"><strong class="dd-unified-name">DEEP DOCUMENTARY</strong><span class="dd-unified-tag" data-dd-tag>الوثائقي العميق · قصص تستحق الاكتشاف</span></span></a><div class="dd-unified-controls"><a href="index.html" data-ar="الرئيسية" data-en="Home">الرئيسية</a><button id="lang" type="button">English 🌐</button></div></header><main class="wrap"><section class="hero"><div class="eyebrow">DEEP DOCUMENTARY · OUR STORY</div><h1 data-ar="من نحن" data-en="About Us">من نحن</h1><p class="lead" data-ar="في كل حدث قصة تستحق أن تُروى، وفي كل سؤال رحلة تستحق أن تبدأ. «Deep Documentary» مساحة رقمية مستقلة تستكشف التاريخ والعلوم والفضاء والغموض، وتقدّم قصصًا وثائقية بالعربية والإنجليزية بأسلوب يجمع بين التشويق والوضوح." data-en="Every event holds a story worth telling, and every question begins a journey. Deep Documentary is an independent digital publication exploring history, science, space, and mysteries through engaging, accessible documentary storytelling in Arabic and English."></p></section><div class="divider"></div><div class="grid"><article class="card"><h2 data-ar="رسالتنا" data-en="Our Mission"></h2><p data-ar="أن نجعل المعرفة رحلة ممتعة؛ نبحث عن القصص التي تثير الفضول، ونقدّم سياقها وتفاصيلها بلغة واضحة تحترم عقل القارئ." data-en="To make learning an engaging journey: discovering stories that spark curiosity and presenting their context in clear language that respects the reader."></p></article><article class="card"><h2 data-ar="رؤيتنا" data-en="Our Vision"></h2><p data-ar="بناء وجهة وثائقية ثنائية اللغة يعود إليها القرّاء لاستكشاف العالم، وطرح الأسئلة، والنظر إلى الأحداث من زوايا أوسع." data-en="To build a bilingual documentary destination where readers return to explore the world, ask questions, and discover broader perspectives."></p></article></div><section class="section"><h2 data-ar="ماذا ستجد لدينا؟" data-en="What We Explore"></h2><p data-ar="من الرحلات الفضائية والاختراقات العلمية إلى الأحداث التاريخية والألغاز التي حيّرت العالم، نختار موضوعات تحمل قيمة معرفية وقصة تستحق المتابعة. كما نقدّم تجارب تفاعلية وألعابًا قصيرة توسّع متعة الاستكشاف." data-en="From space missions and scientific breakthroughs to historical events and enduring mysteries, we focus on subjects with both substance and compelling stories. Interactive experiences and short games offer another way to explore."></p></section><section class="section"><h2 data-ar="كيف نتعامل مع المعلومات؟" data-en="Our Editorial Approach"></h2><ul><li data-ar="نسعى إلى الاعتماد على مصادر أصلية وموثوقة، مثل المؤسسات العلمية والأرشيفات والمراجع المتخصصة." data-en="We aim to use reliable primary sources, including scientific institutions, archives, and specialist references."></li><li data-ar="نميّز بين الحقائق المثبتة والفرضيات والروايات المتنازع عليها، ولا نقدّم التخمين على أنه حقيقة." data-en="We distinguish established facts from hypotheses and disputed accounts, and do not present speculation as fact."></li><li data-ar="نراجع المحتوى ونصحح الأخطاء التي نتبيّنها، ونرحّب بملاحظات القرّاء عبر صفحة التواصل." data-en="We review our work, correct identified errors, and welcome reader feedback through our contact page."></li></ul><p data-ar="المحتوى المنشور لأغراض المعرفة والتثقيف، وليس بديلًا عن المشورة المهنية المتخصصة." data-en="Our content is for information and education, not a substitute for professional advice."></p></section><section class="section"><h2 data-ar="تواصل معنا" data-en="Get in Touch"></h2><p data-ar="هل لديك فكرة لقصة وثائقية؟ أو ملاحظة على مقال؟ نرحّب باقتراحاتك وأسئلتك." data-en="Have an idea for a documentary story or feedback on an article? We welcome your suggestions and questions."></p><a class="cta" href="contact.html" data-ar="راسلنا ←" data-en="Contact Us →">راسلنا ←</a></section></main><footer class="dd-unified-footer"><a href="index.html" aria-label="Deep Documentary home"><img class="dd-footer-logo" src="assets/logo.svg" alt="Deep Documentary"></a><div class="dd-footer-title">DEEP DOCUMENTARY · <span data-ar="الوثائقي العميق" data-en="Explore deeper. Discover more.">الوثائقي العميق</span></div><nav class="dd-footer-links" aria-label="Footer navigation"><a href="index.html" dat
